name: JWPLC Edition - Windows x64 installer

# Builds only the Windows x64 NSIS installer of the JWPLC Edition from the
# pushed commit. Same steps as the build-windows-x64 job of release.yml, but
# without the macOS/Linux jobs and without creating a GitHub release.

on:
  push:
    branches:
      - claude/awesome-goldberg-7sj2vx
    paths-ignore:
      - .github/workflows/jwplc-publish-prerelease.yml
      - .github/workflows/jwplc-windows-installer.yml
      - docs/jwplc/releases/**
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download binaries for x64
        run: npx ts-node scripts/download-binaries.ts --arch x64

      - name: Get version and build date
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION from $GITHUB_SHA"

      - name: Build and package
        env:
          BUILD_DATE: ${{ steps.version.outputs.build_date }}
        run: npm run package

      - name: Checksums
        shell: bash
        run: |
          cd release/build
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: jwplc-edition-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/build/*.exe
            release/build/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
