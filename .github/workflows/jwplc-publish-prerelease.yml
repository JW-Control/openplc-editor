name: JWPLC Edition - Publish pre-release

# Publishes the JWPLC Edition 4.2.8-jwplc.3 pre-release:
#   - the Windows x64 installer already built by "JWPLC Edition - Windows x64
#     installer" (run 39501464185, commit 09378f606), reused as-is;
#   - the signed VPP 2.1.0-alpha.26, packed deterministically from
#     platform-jwplc @ 1b54c7f9 and verified with the editor's own
#     verifyPackageSignature before upload.

on:
  push:
    branches:
      - claude/awesome-goldberg-7sj2vx
    paths:
      - .github/workflows/jwplc-publish-prerelease.yml
      - docs/jwplc/releases/**
  workflow_dispatch:

env:
  TAG: jwplc-editor-v4.2.8-jwplc.3
  TITLE: OpenPLC Editor - JWPLC Edition 4.2.8-jwplc.3
  TARGET_SHA: 09378f60626966cc43e0acc751be983a75ad0f0c
  INSTALLER_RUN_ID: '39501464185'
  INSTALLER_ARTIFACT: jwplc-edition-4.2.8-jwplc.3-windows-x64
  PLATFORM_COMMIT: 1b54c7f9b8118f5e7334ab2f041f45077f6fc23f
  VPP_NAME: jwplc-basic-openplc-2.1.0-alpha.26.jwcontrol-signed.vpp
  NOTES: docs/jwplc/releases/jwplc-editor-v4.2.8-jwplc.3.md

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Download installer from the build run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT }}
          path: dist
          run-id: ${{ env.INSTALLER_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check installer checksum against the build run
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS.txt

      - name: Pack VPP from platform-jwplc
        run: |
          git init -q platform
          git -C platform fetch -q --depth 1 https://github.com/JW-Control/platform-jwplc.git "$PLATFORM_COMMIT"
          mkdir vpp-src
          git -C platform archive "$PLATFORM_COMMIT" openplc-editor-installers/v4.2.7/vpp | tar -x -C vpp-src
          cd vpp-src/openplc-editor-installers/v4.2.7/vpp
          find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort | TZ=UTC zip -q -X -D "$GITHUB_WORKSPACE/dist/$VPP_NAME" -@

      - name: Verify VPP signature with the editor verifier
        run: |
          mkdir -p verify/pkg
          cp src/backend/shared/utils/vpp/verify-package-signature.ts src/backend/shared/utils/vpp/trusted-keys.ts verify/
          unzip -q "dist/$VPP_NAME" -d verify/pkg
          cat > verify/run.ts <<'EOF'
          import { TRUSTED_PACKAGE_KEYS } from './trusted-keys.ts'
          import { verifyPackageSignature } from './verify-package-signature.ts'
          const result = verifyPackageSignature(process.argv[2], TRUSTED_PACKAGE_KEYS)
          console.log(JSON.stringify(result))
          if (!result.valid) process.exit(1)
          EOF
          node --experimental-strip-types --no-warnings verify/run.ts verify/pkg

      - name: Checksums and release notes
        id: files
        working-directory: dist
        run: |
          EXE=$(ls *.exe | head -n 1)
          sha256sum *.exe *.vpp | tee SHA256SUMS.txt
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          sed "s|__EXE_NAME__|$EXE|" "$GITHUB_WORKSPACE/$NOTES" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo '### SHA256'
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease \
            "${{ steps.files.outputs.exe }}" \
            "$VPP_NAME" \
            SHA256SUMS.txt
